<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111a16">
  <title>Acadeima | Gestao</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Acadeima inicio">
        <span class="brand-mark">A</span>
        <span>acadeima<span class="brand-period">.</span></span>
      </a>
      <div class="side-label">MENU PRINCIPAL</div>
      <nav id="navigation" aria-label="Navegação principal"></nav>
      <div class="sidebar-bottom">
        <div class="status-dot"></div>
        <div><strong>Unidade Centro</strong><span>Sistema operacional</span></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">GESTÃO DA ACADEMIA</div>
          <h1 id="page-title">Visão geral</h1>
        </div>
        <div class="topbar-right">
          <span class="today" id="today"></span>
          <div class="avatar">AC</div>
        </div>
      </header>
      <section id="content" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="record-dialog" aria-labelledby="dialog-title">
    <form id="record-form" method="dialog">
      <div class="dialog-head">
        <div><div class="eyebrow">DADOS DO CADASTRO</div><h2 id="dialog-title">Novo registro</h2></div>
        <button class="icon-button" type="button" id="close-dialog" aria-label="Fechar">×</button>
      </div>
      <div id="form-fields" class="form-grid"></div>
      <div class="dialog-actions">
        <button class="button button-quiet" type="button" id="cancel-dialog">Cancelar</button>
        <button class="button button-primary" type="submit">Salvar registro <span>↗</span></button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
